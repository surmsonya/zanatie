<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile Grid</title>
<style>
  :root { --bg:#f4f4f2; --panel:#fff; --ink:#111; --mute:#777; --line:#e2e2e2; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.4 -apple-system, system-ui, sans-serif; color:var(--ink); background:var(--bg);
         display:flex; height:100vh; overflow:hidden; }
  #stage { flex:1; position:relative; display:flex; align-items:center; justify-content:center; padding:24px; min-width:0; }
  #frame { position:relative; box-shadow:0 2px 20px rgba(0,0,0,.08); }
  #frame canvas { position:absolute; inset:0; width:100%; height:100%; }
  #ov { touch-action:none; cursor:crosshair; }
  #drop { position:absolute; inset:24px; display:flex; align-items:center; justify-content:center; text-align:center;
          border:2px dashed #ccc; border-radius:12px; color:var(--mute); font-size:16px; cursor:pointer; }
  body.dragging #drop { border-color:#333; color:#333; background:rgba(0,0,0,.03); }
  aside { width:280px; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:16px; }
  h1 { font-size:14px; margin:0 0 12px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:18px 0 8px; }
  label { display:block; margin:8px 0; }
  label span { display:flex; justify-content:space-between; }
  label span b { font-weight:500; color:var(--mute); }
  input[type=range] { width:100%; }
  select, button { font:inherit; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  button { padding:6px 10px; border:1px solid var(--line); background:#fafafa; border-radius:6px; cursor:pointer; color:inherit; }
  button:hover { background:#f0f0f0; }
  button.main { background:#111; color:#fff; border-color:#111; }
  .check { display:flex; align-items:center; gap:6px; }
  .hint { color:var(--mute); font-size:12px; margin:6px 0 0; }
  @media (max-width:700px) { body { flex-direction:column; height:auto; overflow:auto; }
    #stage { flex:none; height:70vh; padding:16px; } #drop { inset:16px; }
    aside { width:auto; border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<div id="stage">
  <div id="frame"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
  <div id="drop">Перетащи фото сюда<br>или нажми, чтобы выбрать</div>
</div>
<aside>
  <h1>Tile Grid</h1>

  <h2>Фото</h2>
  <div class="row">
    <button id="fileBtn" class="main">Загрузить фото</button>
    <input id="file" type="file" accept="image/*" hidden>
  </div>

  <h2>Сетка</h2>
  <label><span>Колонки <b id="colsV"></b></span><input id="cols" type="range" min="1" max="20" value="5"></label>
  <label><span>Ряды <b id="rowsV"></b></span><input id="rows" type="range" min="1" max="20" value="7"></label>
  <label><span>Зазор <b id="gapV"></b></span><input id="gap" type="range" min="0" max="60" value="0"></label>
  <label class="check"><input id="edges" type="checkbox" checked> Обводки</label>

  <h2>Ячейки</h2>
  <div class="row">
    <button id="showAll">Показать все</button>
    <button id="invert">Инвертировать</button>
    <button id="random">Случайно</button>
  </div>
  <p class="hint">Клик скрывает ячейку, повторный — возвращает. Можно протянуть мышью.</p>

  <h2>Перспектива</h2>
  <div class="row"><button id="resetPersp">Сбросить перспективу</button></div>
  <p class="hint">Тяни круглые ручки по углам сетки.</p>

  <h2>Кадр</h2>
  <label>Формат
    <select id="format">
      <option value="photo">Как у фото</option>
      <option value="0.8">4:5</option>
      <option value="1">1:1</option>
      <option value="0.5625">9:16</option>
      <option value="1.7778">16:9</option>
    </select>
  </label>
  <label>Фон <input id="bg" type="color" value="#ffffff"></label>
  <label class="check"><input id="helper" type="checkbox" checked> Показывать помощник</label>

  <h2>Экспорт</h2>
  <div class="row"><button id="png" class="main">Скачать PNG</button></div>
</aside>

<script>
const $ = id => document.getElementById(id);
const LONG_SIDE = 2400;      // export resolution of the frame
const MAX_TEX = 4000;        // photos are downscaled to this long side
const STROKE = 2.5;          // outline thickness, frame px
const HANDLE_R = 7;          // handle radius, css px

const S = {
  img:null, imgAspect:0.8,
  cols:5, rows:7, hidden:new Set(),
  gap:0, edges:true, bg:'#ffffff', format:'photo', helper:true,
  FW:1920, FH:2400,            // frame size in px
  gridW:1, gridH:1,            // size of the unperturbed grid, used to turn px into uv
  corners:null,                // [TL, TR, BR, BL] in frame px
  H:null, Hinv:null,
  hover:null,
};

// --- homography: unit square -> quad (Heckbert) ---
function squareToQuad(q) {
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]] = q;
  const sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
  let g = 0, h = 0;
  if (Math.abs(sx) > 1e-9 || Math.abs(sy) > 1e-9) {
    const dx1 = x1 - x2, dx2 = x3 - x2, dy1 = y1 - y2, dy2 = y3 - y2;
    const den = dx1 * dy2 - dx2 * dy1;
    g = (sx * dy2 - dx2 * sy) / den;
    h = (dx1 * sy - sx * dy1) / den;
  }
  return [x1 - x0 + g * x1, x3 - x0 + h * x3, x0,
          y1 - y0 + g * y1, y3 - y0 + h * y3, y0,
          g, h, 1];
}
function invert3(m) {
  const [a,b,c,d,e,f,g,h,i] = m;
  const A = e*i - f*h, B = f*g - d*i, C = d*h - e*g;
  const det = a*A + b*B + c*C;
  return [A/det, (c*h - b*i)/det, (b*f - c*e)/det,
          B/det, (a*i - c*g)/det, (c*d - a*f)/det,
          C/det, (b*g - a*h)/det, (a*e - b*d)/det];
}
function project(m, x, y) {
  const w = m[6]*x + m[7]*y + m[8];
  if (w <= 1e-9) return null;
  return [(m[0]*x + m[1]*y + m[2]) / w, (m[3]*x + m[4]*y + m[5]) / w];
}
function updateH() {
  S.H = squareToQuad(S.corners);
  S.Hinv = invert3(S.H);
}

// --- WebGL ---
const glc = $('gl'), ov = $('ov'), ctx = ov.getContext('2d');
const gl = glc.getContext('webgl', { antialias:true, preserveDrawingBuffer:true });

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, `
  attribute vec2 a_uv;
  uniform mat3 u_H;
  uniform vec2 u_size;
  varying vec2 v_uv;
  void main() {
    // homogeneous pixel coords -> clip space, keeping w so the GPU interpolates with perspective
    vec3 p = u_H * vec3(a_uv, 1.0);
    v_uv = a_uv;
    gl_Position = vec4(2.0 * p.x / u_size.x - p.z, p.z - 2.0 * p.y / u_size.y, 0.0, p.z);
  }`));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, `
  #ifdef GL_FRAGMENT_PRECISION_HIGH
  precision highp float;
  #else
  precision mediump float;
  #endif
  uniform sampler2D u_tex;
  uniform vec4 u_color;
  uniform float u_solid;
  varying vec2 v_uv;
  void main() { gl_FragColor = u_solid > 0.5 ? u_color : texture2D(u_tex, v_uv); }`));
gl.linkProgram(prog);
gl.useProgram(prog);
const loc = {
  uv: gl.getAttribLocation(prog, 'a_uv'),
  H: gl.getUniformLocation(prog, 'u_H'),
  size: gl.getUniformLocation(prog, 'u_size'),
  color: gl.getUniformLocation(prog, 'u_color'),
  solid: gl.getUniformLocation(prog, 'u_solid'),
};
gl.enableVertexAttribArray(loc.uv);
const cellBuf = gl.createBuffer(), strokeBuf = gl.createBuffer();
let cellCount = 0, strokeCount = 0;
const tex = gl.createTexture();
const maxTex = Math.min(MAX_TEX, gl.getParameter(gl.MAX_TEXTURE_SIZE));

function pushRect(arr, u0, v0, u1, v1) {
  arr.push(u0,v0, u1,v0, u1,v1,  u0,v0, u1,v1, u0,v1);
}

// rebuilt when cells, gap or outlines change; corner drags only touch u_H
function buildMesh() {
  const cells = [], strokes = [];
  const gu = S.gap / 2 / S.gridW, gv = S.gap / 2 / S.gridH;
  const tu = STROKE / 2 / S.gridW, tv = STROKE / 2 / S.gridH;
  for (let c = 0; c < S.cols; c++) for (let r = 0; r < S.rows; r++) {
    if (S.hidden.has(c + ',' + r)) continue;
    const u0 = c / S.cols + gu, u1 = (c + 1) / S.cols - gu;
    const v0 = r / S.rows + gv, v1 = (r + 1) / S.rows - gv;
    if (u1 <= u0 || v1 <= v0) continue;
    pushRect(cells, u0, v0, u1, v1);
    if (S.edges) {   // bands centred on the edges, so shared edges at zero gap aren't doubled
      pushRect(strokes, u0 - tu, v0 - tv, u1 + tu, v0 + tv);
      pushRect(strokes, u0 - tu, v1 - tv, u1 + tu, v1 + tv);
      pushRect(strokes, u0 - tu, v0 + tv, u0 + tu, v1 - tv);
      pushRect(strokes, u1 - tu, v0 + tv, u1 + tu, v1 - tv);
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, cellBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(cells), gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, strokeBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(strokes), gl.STATIC_DRAW);
  cellCount = cells.length / 2; strokeCount = strokes.length / 2;
}

function hexRGB(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }

function renderGL() {
  gl.viewport(0, 0, glc.width, glc.height);
  const [r, g, b] = hexRGB(S.bg);
  gl.clearColor(r, g, b, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if (!S.img) return;
  const m = S.H;   // row-major -> column-major for GLSL
  gl.uniformMatrix3fv(loc.H, false, [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]]);
  gl.uniform2f(loc.size, S.FW, S.FH);

  gl.uniform1f(loc.solid, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, cellBuf);
  gl.vertexAttribPointer(loc.uv, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, cellCount);

  if (strokeCount) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform1f(loc.solid, 1);
    gl.uniform4f(loc.color, .55, .55, .55, .9);
    gl.bindBuffer(gl.ARRAY_BUFFER, strokeBuf);
    gl.vertexAttribPointer(loc.uv, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, strokeCount);
    gl.disable(gl.BLEND);
  }
}

// --- 2D overlay: helper grid, hover, handles ---
function overlayScale() { return ov.width / S.FW; }   // frame px -> overlay px

function drawOverlay() {
  const k = overlayScale(), dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, ov.width, ov.height);
  if (!S.img) return;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  const px = dpr / k;   // one css px in frame units
  const P = (u, v) => project(S.H, u, v);
  const seg = (a, b) => { if (a && b) { ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); } };

  if (S.hover) {
    const [c, r] = S.hover.split(',').map(Number);
    const q = [P(c / S.cols, r / S.rows), P((c + 1) / S.cols, r / S.rows),
               P((c + 1) / S.cols, (r + 1) / S.rows), P(c / S.cols, (r + 1) / S.rows)];
    if (q.every(Boolean)) {
      ctx.beginPath(); q.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
      ctx.fillStyle = 'rgba(40,120,255,.18)'; ctx.fill();
      ctx.strokeStyle = 'rgba(40,120,255,.9)'; ctx.lineWidth = 1.5 * px; ctx.setLineDash([]); ctx.stroke();
    }
  }

  if (!S.helper) return;
  ctx.beginPath();
  for (let c = 0; c <= S.cols; c++) seg(P(c / S.cols, 0), P(c / S.cols, 1));
  for (let r = 0; r <= S.rows; r++) seg(P(0, r / S.rows), P(1, r / S.rows));
  ctx.lineWidth = px; ctx.setLineDash([4 * px, 4 * px]);
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.stroke();
  ctx.lineDashOffset = 4 * px; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
  ctx.lineDashOffset = 0; ctx.setLineDash([]);

  for (const [x, y] of S.corners) {
    ctx.beginPath(); ctx.arc(x, y, HANDLE_R * px, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 2 * px; ctx.strokeStyle = '#2878ff'; ctx.stroke();
  }
}

let raf = 0;
function render() {
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; renderGL(); drawOverlay(); });
}

// --- frame & layout ---
function frameAspect() { return S.format === 'photo' ? S.imgAspect : +S.format; }

function resetCorners() {
  const a = S.imgAspect, m = 0.72;
  const w = Math.min(S.FW * m, S.FH * m * a), h = w / a;
  const x0 = (S.FW - w) / 2, y0 = (S.FH - h) / 2;
  S.gridW = w; S.gridH = h;
  S.corners = [[x0, y0], [x0 + w, y0], [x0 + w, y0 + h], [x0, y0 + h]];
  updateH();
}

function setupFrame() {
  const a = frameAspect();
  S.FW = a >= 1 ? LONG_SIDE : Math.round(LONG_SIDE * a);
  S.FH = a >= 1 ? Math.round(LONG_SIDE / a) : LONG_SIDE;
  glc.width = S.FW; glc.height = S.FH;
  resetCorners();
  buildMesh();
  layout();
}

function layout() {
  const st = $('stage'), cs = getComputedStyle(st);
  const sw = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const sh = st.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const s = Math.min(sw / S.FW, sh / S.FH);
  const w = Math.max(1, Math.floor(S.FW * s)), h = Math.max(1, Math.floor(S.FH * s));
  const fr = $('frame'); fr.style.width = w + 'px'; fr.style.height = h + 'px';
  const dpr = window.devicePixelRatio || 1;
  ov.width = Math.round(w * dpr); ov.height = Math.round(h * dpr);
  render();
}
new ResizeObserver(layout).observe($('stage'));

// --- photo loading ---
function loadFile(f) {
  if (!f || !f.type.startsWith('image')) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => { URL.revokeObjectURL(url); setImage(img); };
  img.onerror = () => alert('Не удалось открыть это изображение');
  img.src = url;
}

function setImage(img) {
  let src = img, w = img.naturalWidth, h = img.naturalHeight;
  if (Math.max(w, h) > maxTex) {
    const s = maxTex / Math.max(w, h);
    src = document.createElement('canvas');
    src.width = Math.round(w * s); src.height = Math.round(h * s);
    src.getContext('2d').drawImage(img, 0, 0, src.width, src.height);
  }
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  S.img = img; S.imgAspect = w / h;
  S.hidden.clear();
  $('drop').style.display = 'none';
  setupFrame();
}

$('fileBtn').onclick = $('drop').onclick = () => $('file').click();
$('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('dragging');
  loadFile(e.dataTransfer.files[0]);
});

// --- pointer: drag corners, paint cells ---
let drag = null;   // {corner:i} | {hide:bool, last:key}

function toFrame(e) {
  const r = ov.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * S.FW, (e.clientY - r.top) / r.height * S.FH, S.FW / r.width];
}
function cellAt(x, y) {
  const q = project(S.Hinv, x, y);
  if (!q || q[0] < 0 || q[0] >= 1 || q[1] < 0 || q[1] >= 1) return null;
  return Math.floor(q[0] * S.cols) + ',' + Math.floor(q[1] * S.rows);
}
function cornerAt(x, y, cssToFrame) {
  if (!S.helper) return -1;
  const r = (HANDLE_R + 6) * cssToFrame;
  return S.corners.findIndex(([cx, cy]) => Math.hypot(cx - x, cy - y) <= r);
}
function setCell(key, hide) {
  if (hide === S.hidden.has(key)) return;
  hide ? S.hidden.add(key) : S.hidden.delete(key);
  buildMesh();
}

ov.addEventListener('pointerdown', e => {
  if (!S.img) return;
  const [x, y, k] = toFrame(e);
  const i = cornerAt(x, y, k);
  if (i >= 0) drag = { corner:i };
  else {
    const key = cellAt(x, y);
    if (!key) return;
    drag = { hide:!S.hidden.has(key), last:key, x, y };
    setCell(key, drag.hide);
  }
  ov.setPointerCapture(e.pointerId);
  render();
});
ov.addEventListener('pointermove', e => {
  if (!S.img) return;
  const [x, y, k] = toFrame(e);
  if (drag && drag.corner !== undefined) {
    S.corners[drag.corner] = [Math.max(0, Math.min(S.FW, x)), Math.max(0, Math.min(S.FH, y))];
    updateH();
    S.hover = null;
  } else {
    const key = cellAt(x, y);
    if (drag) {   // walk the segment since the last event, so fast strokes don't skip cells
      const steps = Math.ceil(Math.hypot(x - drag.x, y - drag.y) / (4 * k));
      for (let i = 1; i <= steps; i++) {
        const t = i / steps, kk = cellAt(drag.x + (x - drag.x) * t, drag.y + (y - drag.y) * t);
        if (kk && kk !== drag.last) { setCell(kk, drag.hide); drag.last = kk; }
      }
      drag.x = x; drag.y = y;
    }
    S.hover = key;
    ov.style.cursor = cornerAt(x, y, k) >= 0 ? 'grab' : key ? 'pointer' : 'crosshair';
  }
  render();
});
const endDrag = () => { drag = null; };
ov.addEventListener('pointerup', endDrag);
ov.addEventListener('pointercancel', endDrag);
ov.addEventListener('pointerleave', () => { if (!drag) { S.hover = null; render(); } });

// --- controls ---
function syncLabels() { for (const id of ['cols', 'rows', 'gap']) $(id + 'V').textContent = $(id).value; }
for (const id of ['cols', 'rows']) $(id).addEventListener('input', () => {
  S[id] = +$(id).value; S.hidden.clear(); S.hover = null; syncLabels(); buildMesh(); render();
});
$('gap').addEventListener('input', () => { S.gap = +$('gap').value; syncLabels(); buildMesh(); render(); });
$('edges').addEventListener('change', () => { S.edges = $('edges').checked; buildMesh(); render(); });
$('bg').addEventListener('input', () => { S.bg = $('bg').value; render(); });
$('helper').addEventListener('change', () => { S.helper = $('helper').checked; render(); });
$('format').addEventListener('change', () => { S.format = $('format').value; setupFrame(); });
$('resetPersp').onclick = () => { resetCorners(); render(); };

function eachCell(fn) { for (let c = 0; c < S.cols; c++) for (let r = 0; r < S.rows; r++) fn(c + ',' + r); }
$('showAll').onclick = () => { S.hidden.clear(); buildMesh(); render(); };
$('invert').onclick = () => {
  const h = new Set(); eachCell(k => { if (!S.hidden.has(k)) h.add(k); });
  S.hidden = h; buildMesh(); render();
};
$('random').onclick = () => {
  S.hidden.clear(); eachCell(k => { if (Math.random() < 0.4) S.hidden.add(k); });
  buildMesh(); render();
};

$('png').onclick = () => {
  if (!S.img) return;
  renderGL();
  glc.toBlob(b => {
    const a = document.createElement('a');
    a.download = 'tiles.png'; a.href = URL.createObjectURL(b); a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
};

syncLabels();
setupFrame();
</script>
</body>
</html>
